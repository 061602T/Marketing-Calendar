<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NYC Bar — Marketing Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #1a2e4a;
  --navy2: #243d61;
  --gold: #b8933a;
  --gold2: #d4a843;
  --bg: #f4f5f7;
  --white: #ffffff;
  --border: #e2e5ec;
  --text: #1a2032;
  --text2: #5a6278;
  --text3: #9aa0b2;
  --radius: 8px;
  --shadow: 0 1px 3px rgba(26,46,74,.08);
  --shadow-md: 0 4px 16px rgba(26,46,74,.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── Top bar ── */
.topbar {
  background: var(--navy);
  padding: 0 24px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-logo { color: #fff; font-size: 14px; font-weight: 500; letter-spacing: .3px; display: flex; align-items: center; gap: 10px; }
.topbar-logo span { color: var(--gold2); font-weight: 300; }
.topbar-nav { display: flex; gap: 4px; }
.topbar-nav button {
  background: none; border: none; color: rgba(255,255,255,.65);
  font-family: inherit; font-size: 13px; padding: 6px 12px;
  border-radius: 6px; cursor: pointer; transition: all .15s;
}
.topbar-nav button:hover { background: rgba(255,255,255,.1); color: #fff; }
.topbar-nav button.active { background: rgba(255,255,255,.15); color: #fff; }

/* ── Main layout ── */
.main { display: flex; height: calc(100vh - 52px); }

/* ── Sidebar ── */
.sidebar {
  width: 260px;
  flex-shrink: 0;
  background: var(--white);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-section { padding: 16px; border-bottom: 1px solid var(--border); }
.sidebar-label { font-size: 10px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; }
.search-wrap { position: relative; }
.search-wrap input {
  width: 100%; padding: 8px 10px 8px 32px;
  border: 1px solid var(--border); border-radius: var(--radius);
  font-family: inherit; font-size: 13px; color: var(--text);
  background: var(--bg); outline: none; transition: border .15s;
}
.search-wrap input:focus { border-color: var(--navy); }
.search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 13px; }
.filter-group { display: flex; flex-direction: column; gap: 4px; }
.filter-btn {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 8px; border-radius: 6px; cursor: pointer;
  font-size: 12px; color: var(--text2); transition: all .12s;
  border: none; background: none; font-family: inherit; text-align: left;
}
.filter-btn:hover { background: var(--bg); color: var(--text); }
.filter-btn.active { background: rgba(26,46,74,.08); color: var(--navy); font-weight: 500; }
.filter-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.filter-count { font-size: 10px; color: var(--text3); background: var(--bg); padding: 1px 6px; border-radius: 10px; }
.owner-list { display: flex; flex-direction: column; gap: 2px; max-height: 180px; overflow-y: auto; }
.owner-btn {
  padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 12px;
  color: var(--text2); background: none; border: none; font-family: inherit;
  text-align: left; transition: all .12s;
}
.owner-btn:hover { background: var(--bg); color: var(--text); }
.owner-btn.active { background: rgba(26,46,74,.08); color: var(--navy); font-weight: 500; }

/* ── Calendar area ── */
.cal-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.cal-header {
  padding: 16px 20px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--border);
  background: var(--white);
}
.cal-month { font-size: 20px; font-weight: 500; color: var(--navy); min-width: 200px; }
.cal-nav { display: flex; gap: 4px; }
.nav-btn {
  width: 30px; height: 30px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--white);
  cursor: pointer; font-size: 14px; color: var(--text2);
  display: flex; align-items: center; justify-content: center;
  transition: all .12s;
}
.nav-btn:hover { border-color: var(--navy); color: var(--navy); }
.today-btn {
  padding: 5px 14px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--white);
  cursor: pointer; font-size: 12px; font-weight: 500; color: var(--text2);
  font-family: inherit; transition: all .12s; margin-left: 4px;
}
.today-btn:hover { border-color: var(--navy); color: var(--navy); }
.cal-count { margin-left: auto; font-size: 12px; color: var(--text3); }

/* ── Grid ── */
.cal-grid-wrap { flex: 1; overflow-y: auto; padding: 0; }
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  border-left: 1px solid var(--border);
  border-top: 1px solid var(--border);
  min-height: calc(100% - 28px);
}
.day-header {
  padding: 8px 0;
  text-align: center;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .6px;
  text-transform: uppercase;
  color: var(--text3);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  background: var(--white);
  position: sticky; top: 0; z-index: 10;
}
.day-cell {
  min-height: 110px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 6px 5px;
  background: var(--white);
  vertical-align: top;
}
.day-cell.other { background: #fafbfc; }
.day-cell.today { background: #f0f4f9; }
.day-num {
  font-size: 12px; font-weight: 500;
  color: var(--text3);
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; margin-bottom: 4px;
}
.day-cell.today .day-num { background: var(--navy); color: #fff; }
.ev {
  font-size: 10px; line-height: 1.35;
  border-radius: 4px; padding: 2px 5px;
  margin-bottom: 2px; cursor: pointer;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  transition: opacity .1s; font-family: 'DM Sans', sans-serif;
}
.ev:hover { opacity: .8; }
.more { font-size: 10px; color: var(--text3); padding: 1px 5px; cursor: pointer; }
.more:hover { color: var(--navy); }

/* ── Event type colors ── */
.t-CLE          { background: #daeaf8; color: #0c3d6e; }
.t-NonCLE       { background: #d7f0e4; color: #145a35; }
.t-Dues         { background: #fde9c0; color: #6b3d08; }
.t-MemPromo     { background: #e9e6fc; color: #3a2888; }
.t-MemBen       { background: #d4f0e8; color: #0a4a35; }
.t-Onboarding   { background: #fce8e8; color: #7a1a1a; }
.t-Other        { background: #eaebee; color: #444; }

/* ── Detail drawer ── */
.drawer-overlay {
  position: fixed; inset: 0; background: rgba(26,46,74,.3);
  z-index: 200; opacity: 0; pointer-events: none; transition: opacity .2s;
}
.drawer-overlay.open { opacity: 1; pointer-events: all; }
.drawer {
  position: fixed; right: 0; top: 52px; bottom: 0; width: 380px;
  background: var(--white); border-left: 1px solid var(--border);
  z-index: 201; transform: translateX(100%); transition: transform .22s cubic-bezier(.4,0,.2,1);
  display: flex; flex-direction: column; overflow: hidden;
}
.drawer.open { transform: translateX(0); }
.drawer-head {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; gap: 12px;
}
.drawer-type-badge {
  font-size: 10px; font-weight: 600; letter-spacing: .5px;
  text-transform: uppercase; padding: 3px 8px; border-radius: 4px;
  flex-shrink: 0; margin-top: 2px;
}
.drawer-title { font-size: 14px; font-weight: 500; color: var(--navy); line-height: 1.4; flex: 1; }
.drawer-close {
  background: none; border: none; cursor: pointer;
  color: var(--text3); font-size: 18px; line-height: 1;
  padding: 2px; flex-shrink: 0;
}
.drawer-close:hover { color: var(--text); }
.drawer-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
.field { margin-bottom: 14px; }
.field label { font-size: 10px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--text3); display: block; margin-bottom: 4px; }
.field p { font-size: 13px; color: var(--text); line-height: 1.5; }
.field p.empty { color: var(--text3); font-style: italic; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }

/* ── Day list ("+more" expansion) ── */
.day-list { padding: 16px 20px; }
.day-list-title { font-size: 14px; font-weight: 500; color: var(--navy); margin-bottom: 12px; }
.day-list-item {
  padding: 10px 12px; border-radius: var(--radius);
  border: 1px solid var(--border); margin-bottom: 8px;
  cursor: pointer; transition: border-color .12s;
}
.day-list-item:hover { border-color: var(--navy); }
.day-list-item .ev-name { font-size: 13px; font-weight: 500; color: var(--text); }
.day-list-item .ev-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }

/* ── Loading ── */
.loading { display: flex; align-items: center; justify-content: center; height: 200px; color: var(--text3); font-size: 14px; gap: 10px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">NYC Bar Association <span>/ Marketing Calendar</span></div>
  <div class="topbar-nav">
    <button class="active" onclick="setView('calendar',this)">Calendar</button>
    <button onclick="setView('list',this)">List</button>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Search</div>
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input type="text" id="search" placeholder="Program name…" oninput="applyFilters()">
      </div>
    </div>
    <div class="sidebar-section" style="flex:1;overflow-y:auto">
      <div class="sidebar-label">Program Type</div>
      <div class="filter-group" id="type-filters"></div>
      <div class="sidebar-label" style="margin-top:16px">Owner</div>
      <div class="owner-list" id="owner-filters"></div>
    </div>
  </div>

  <div class="cal-area">
    <div class="cal-header">
      <span class="cal-month" id="cal-month"></span>
      <div class="cal-nav">
        <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
        <button class="today-btn" onclick="goToday()">Today</button>
        <button class="nav-btn" onclick="changeMonth(1)">›</button>
      </div>
      <span class="cal-count" id="cal-count"></span>
    </div>
    <div class="cal-grid-wrap">
      <div class="cal-grid" id="cal-grid"></div>
    </div>
  </div>
</div>

<div class="drawer-overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <span class="drawer-type-badge" id="d-badge"></span>
    <span class="drawer-title" id="d-title"></span>
    <button class="drawer-close" onclick="closeDrawer()">×</button>
  </div>
  <div class="drawer-body" id="d-body"></div>
</div>

<script>
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

const TYPE_META = {
  'CLE':                 {label:'CLE',          cls:'t-CLE',       dot:'#378add'},
  'Non CLE Program':     {label:'Non CLE',       cls:'t-NonCLE',    dot:'#639922'},
  'Dues Email':          {label:'Dues',          cls:'t-Dues',      dot:'#ba7517'},
  'Membership Promotion':{label:'Mem. Promo',    cls:'t-MemPromo',  dot:'#7f77dd'},
  'Membership Benefit':  {label:'Mem. Benefit',  cls:'t-MemBen',    dot:'#1d9e75'},
  'Member Onboarding':   {label:'Onboarding',    cls:'t-Onboarding',dot:'#d85a30'},
};
function typeMeta(t){ return TYPE_META[t] || {label:t||'Other',cls:'t-Other',dot:'#888'}; }

let allEvents = [];
let filtered = [];
let curDate = new Date();
let activeType = null;
let activeOwner = null;

function parseDate(str){
  if(!str) return null;
  const p = str.split('/');
  if(p.length===3) return new Date(+p[2], +p[0]-1, +p[1]);
  return null;
}

// ── Load data from SharePoint via Graph API ──────────────────────────────
// Replace these values with your actual tenant and list IDs
const SITE_URL   = 'YOUR_SHAREPOINT_SITE_URL';  // e.g. https://nycbar.sharepoint.com/sites/Marketing
const LIST_NAME  = 'MarketingCalendar';           // exact name of your list

async function loadData(){
  document.getElementById('cal-grid').innerHTML = '<div class="loading" style="grid-column:span 7">Loading your calendar…</div>';
  try {
    const token = await getToken();
    const siteId = await getSiteId(token);
    const items  = await getListItems(token, siteId);
    allEvents = items;
    buildSidebar();
    applyFilters();
  } catch(e) {
    // Fallback to sample data if not configured yet
    console.warn('Using sample data:', e.message);
    allEvents = SAMPLE;
    buildSidebar();
    applyFilters();
  }
}

async function getToken(){
  // Uses MSAL implicit flow — works when page is hosted inside SharePoint
  // If running standalone, user will be prompted to sign in
  const clientId = 'YOUR_AZURE_APP_CLIENT_ID';  // from your Azure app registration
  const tenantId = 'YOUR_TENANT_ID';
  const scope = 'https://graph.microsoft.com/Sites.Read.All';
  const authority = `https://login.microsoftonline.com/${tenantId}`;

  if(typeof msal === 'undefined') throw new Error('MSAL not loaded — using sample data');

  const app = new msal.PublicClientApplication({ auth: { clientId, authority } });
  const req = { scopes: [scope] };
  try {
    const r = await app.acquireTokenSilent(req);
    return r.accessToken;
  } catch {
    const r = await app.acquireTokenPopup(req);
    return r.accessToken;
  }
}

async function getSiteId(token){
  const host = new URL(SITE_URL).host;
  const path = new URL(SITE_URL).pathname;
  const r = await fetch(`https://graph.microsoft.com/v1.0/sites/${host}:${path}`,
    { headers: { Authorization: 'Bearer '+token } });
  const d = await r.json();
  return d.id;
}

async function getListItems(token, siteId){
  const fields = 'Title,ProgramName,ProgramType,EmailType,EmailSendDate,Owner,SubjectLine,ProjectStatus,FromLine,TargetAudience,RMName,Notes';
  let url = `https://graph.microsoft.com/v1.0/sites/${siteId}/lists/${LIST_NAME}/items?expand=fields(select=${fields})&$top=1000`;
  let items = [];
  while(url){
    const r = await fetch(url, { headers: { Authorization: 'Bearer '+token } });
    const d = await r.json();
    items = items.concat(d.value.map(i => i.fields));
    url = d['@odata.nextLink'] || null;
  }
  return items;
}

// ── Sidebar ──────────────────────────────────────────────────────────────
function buildSidebar(){
  const typeCounts = {};
  allEvents.forEach(e => { typeCounts[e.ProgramType] = (typeCounts[e.ProgramType]||0)+1; });

  const tf = document.getElementById('type-filters');
  tf.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'filter-btn' + (activeType===null?' active':'');
  allBtn.innerHTML = `<span>All types</span><span class="filter-count">${allEvents.length}</span>`;
  allBtn.onclick = () => { activeType=null; buildSidebar(); applyFilters(); };
  tf.appendChild(allBtn);

  Object.entries(typeCounts).sort((a,b)=>b[1]-a[1]).forEach(([type,cnt]) => {
    const m = typeMeta(type);
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (activeType===type?' active':'');
    btn.innerHTML = `<span style="display:flex;align-items:center;gap:6px"><span class="filter-dot" style="background:${m.dot}"></span>${m.label}</span><span class="filter-count">${cnt}</span>`;
    btn.onclick = () => { activeType = activeType===type?null:type; buildSidebar(); applyFilters(); };
    tf.appendChild(btn);
  });

  const owners = [...new Set(allEvents.map(e=>e.Owner).filter(Boolean))].sort();
  const of = document.getElementById('owner-filters');
  of.innerHTML = '';
  const allO = document.createElement('button');
  allO.className = 'owner-btn' + (activeOwner===null?' active':'');
  allO.textContent = 'All owners';
  allO.onclick = () => { activeOwner=null; buildSidebar(); applyFilters(); };
  of.appendChild(allO);
  owners.forEach(o => {
    const btn = document.createElement('button');
    btn.className = 'owner-btn' + (activeOwner===o?' active':'');
    btn.textContent = o;
    btn.onclick = () => { activeOwner = activeOwner===o?null:o; buildSidebar(); applyFilters(); };
    of.appendChild(btn);
  });
}

function applyFilters(){
  const q = document.getElementById('search').value.toLowerCase();
  filtered = allEvents.filter(e => {
    if(activeType && e.ProgramType !== activeType) return false;
    if(activeOwner && e.Owner !== activeOwner) return false;
    if(q && !(e.ProgramName||'').toLowerCase().includes(q) && !(e.Title||'').toLowerCase().includes(q)) return false;
    return true;
  });
  renderCal();
}

// ── Calendar render ───────────────────────────────────────────────────────
function renderCal(){
  const y = curDate.getFullYear(), m = curDate.getMonth();
  document.getElementById('cal-month').textContent = MONTHS[m] + ' ' + y;

  const byDay = {};
  let monthCount = 0;
  filtered.forEach(e => {
    const d = parseDate(e.EmailSendDate);
    if(!d) return;
    if(d.getFullYear()===y && d.getMonth()===m){
      monthCount++;
      const k = d.getDate();
      if(!byDay[k]) byDay[k] = [];
      byDay[k].push(e);
    }
  });
  document.getElementById('cal-count').textContent = monthCount + ' email' + (monthCount!==1?'s':'') + ' this month';

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  DAYS.forEach(d => {
    const h = document.createElement('div');
    h.className = 'day-header'; h.textContent = d;
    grid.appendChild(h);
  });

  const firstDay = new Date(y,m,1).getDay();
  const dim = new Date(y,m+1,0).getDate();
  const prevDim = new Date(y,m,0).getDate();
  const today = new Date();
  const total = Math.ceil((firstDay+dim)/7)*7;

  for(let i=0; i<total; i++){
    const cell = document.createElement('div');
    let dn, cur=true;
    if(i<firstDay){ dn=prevDim-firstDay+i+1; cur=false; cell.classList.add('other'); }
    else if(i>=firstDay+dim){ dn=i-firstDay-dim+1; cur=false; cell.classList.add('other'); }
    else {
      dn=i-firstDay+1; cell.className='day-cell';
      if(today.getFullYear()===y && today.getMonth()===m && today.getDate()===dn) cell.classList.add('today');
    }
    cell.className = cell.className || 'day-cell';

    const num = document.createElement('div');
    num.className='day-num'; num.textContent=dn;
    cell.appendChild(num);

    if(cur && byDay[dn]){
      const evs = byDay[dn];
      evs.slice(0,3).forEach(ev => {
        const el = document.createElement('div');
        el.className = 'ev '+typeMeta(ev.ProgramType).cls;
        el.textContent = (ev.ProgramName||ev.Title||'') + (ev.EmailType?' · '+ev.EmailType:'');
        el.title = ev.Title||'';
        el.onclick = () => openDrawer(ev);
        cell.appendChild(el);
      });
      if(evs.length>3){
        const more = document.createElement('div');
        more.className='more';
        more.textContent='+' + (evs.length-3) + ' more';
        more.onclick = () => openDayList(evs, dn, m, y);
        cell.appendChild(more);
      }
    }
    grid.appendChild(cell);
  }
}

// ── Drawer ────────────────────────────────────────────────────────────────
function openDrawer(ev){
  const m = typeMeta(ev.ProgramType);
  const badge = document.getElementById('d-badge');
  badge.textContent = m.label;
  badge.style.background = m.dot+'22';
  badge.style.color = m.dot;

  document.getElementById('d-title').textContent = ev.Title || ev.ProgramName || '';

  const fields = [
    ['Program name', ev.ProgramName],
    ['Program type', ev.ProgramType],
    ['Email type', ev.EmailType],
    ['Send date', ev.EmailSendDate],
    ['Owner', ev.Owner],
    ['RM name', ev.RMName],
    ['Subject line', ev.SubjectLine],
    ['From line', ev.FromLine],
    ['Target audience', ev.TargetAudience],
    ['Project status', ev.ProjectStatus],
    ['Notes', ev.Notes],
  ];

  document.getElementById('d-body').innerHTML = fields.map(([l,v]) => `
    <div class="field">
      <label>${l}</label>
      <p class="${v?'':'empty'}">${v || '—'}</p>
    </div>
  `).join('');

  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}

function openDayList(evs, day, month, year){
  document.getElementById('d-badge').textContent = MONTHS[month]+' '+day;
  document.getElementById('d-badge').style.cssText = 'background:#eaebee;color:#444';
  document.getElementById('d-title').textContent = evs.length+' emails';
  document.getElementById('d-body').innerHTML = `
    <div class="day-list">
      ${evs.map(ev => `
        <div class="day-list-item" onclick='openDrawer(${JSON.stringify(ev).replace(/'/g,"&#39;")})'>
          <div class="ev-name">${ev.ProgramName||ev.Title||''}</div>
          <div class="ev-sub">${ev.ProgramType||''} ${ev.EmailType?'· '+ev.EmailType:''} ${ev.Owner?'· '+ev.Owner:''}</div>
        </div>
      `).join('')}
    </div>`;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}

function closeDrawer(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

function changeMonth(d){ curDate.setMonth(curDate.getMonth()+d); renderCal(); }
function goToday(){ curDate=new Date(); renderCal(); }
function setView(v,btn){
  document.querySelectorAll('.topbar-nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
